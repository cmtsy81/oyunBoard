<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batak Skor</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* ── BATAK RENK TOKENları ─────────────────── */
        :root {
            --accent:    #2c3e50;
            --accent-lg: #34495e;
        }
        .header      { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-lg) 100%); }
        .btn-start   { background: var(--accent-lg); }
        .score-table th { background: var(--accent); }
        .h-item      { border-left-color: var(--accent-lg); }
        .p-score     { font-size: 24px; font-weight: 800; color: var(--accent-lg); }

        /* ── BATAK'A ÖZGÜ ─────────────────────────── */
        .game-type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 20px;
        }
        .gt-btn {
            padding: 10px 2px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            text-align: center;
        }
        .gt-btn.selected { background: var(--accent-lg); color: white; border-color: var(--accent-lg); }

        .team-a { border-left: 4px solid #3498db; }
        .team-b { border-left: 4px solid #e74c3c; }

        .center-button {
            background: var(--accent-lg);
            color: white;
            border: none;
            padding: 0;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(44,62,80,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .center-button:active { transform: scale(0.95); }

        /* İhale giriş paneli */
        .bid-section { background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .bid-row     { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .bid-label   { font-weight: bold; font-size: 13px; color: #333; }
        .bid-select  { padding: 8px; border-radius: 6px; border: 1px solid #ccc; background: white; flex: 1; margin-left: 10px; font-size: 14px; }

        .btn-green-batak { background: #27ae60; color: white; }
        .btn-green-batak:disabled { background: #bdc3c7; cursor: not-allowed; opacity: 0.7; }

        /* Dialog butonları */
        .d-danger { background: #e74c3c; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="btn-icon" onclick="goHome()">🏠</button>
            <h1>BATAK</h1>
            <div class="header-right">
                <button class="btn-icon" onclick="openSheetModal()" title="Puan Tablosu">📊</button>
                <button class="btn-icon" onclick="resetGame()" title="Sıfırla">🔄</button>
            </div>
        </div>

        <div class="content">
            <div class="setup-section active" id="setupSection">
                <div style="margin-bottom:15px;">
                    <label style="font-size:12px; font-weight:bold; color:#666; display:block; margin-bottom:8px;">Oyun Türü</label>
                    <div class="game-type-grid">
                        <button class="gt-btn selected" onclick="selectGameType('ihaleli', this)">İhaleli</button>
                        <button class="gt-btn" onclick="selectGameType('esli', this)">Eşli</button>
                        <button class="gt-btn" onclick="selectGameType('kozmaca', this)">Koz Maça</button>
                        <button class="gt-btn" onclick="selectGameType('gommeli', this)">Gömmeli</button>
                    </div>
                </div>

                <div class="table-layout">
                    <div class="pos-top setup-input-wrapper"><label class="setup-label">Karşı</label><input type="text" class="player-name-input" id="p2" value="Karşı"></div>
                    <div class="pos-left setup-input-wrapper"><label class="setup-label">Sol</label><input type="text" class="player-name-input" id="p3" value="Sol"></div>
                    <div class="pos-center" style="opacity:0.3; font-weight:bold;">MASA</div>
                    <div class="pos-right setup-input-wrapper"><label class="setup-label">Sağ</label><input type="text" class="player-name-input" id="p1" value="Sağ"></div>
                    <div class="pos-bottom setup-input-wrapper"><label class="setup-label">Ben</label><input type="text" class="player-name-input" id="p0" value="Ben"></div>
                </div>
                <button class="btn-start" onclick="startGame()">Oyunu Başlat</button>
            </div>

            <div class="scoreboard" id="scoreboard">
                <div class="table-layout" id="gameTable">
                    <div class="pos-center">
                        <button class="center-button" onclick="openInputModal(null)">
                            <span style="font-size:20px">✍️</span>
                            ELİ GİR
                        </button>
                    </div>
                </div>

                <div class="history-area">
                    <div class="history-label">Geçmiş Eller</div>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>
        <div class="footer-version" id="footerVersion">v1.1.0</div>
    </div>

    <!-- Skor Giriş Modal -->
    <div class="modal" id="inputModal">
        <div class="modal-content">
            <div class="modal-title">Skorları Gir</div>
            <div class="bid-section" id="bidSection">
                <div class="bid-row">
                    <span class="bid-label">İhaleyi Alan:</span>
                    <select id="bidderSelect" class="bid-select"></select>
                </div>
                <div class="bid-row">
                    <span class="bid-label">İhale Sayısı:</span>
                    <select id="bidAmountSelect" class="bid-select"></select>
                </div>
            </div>
            <div class="game-panel">
                <div id="inputRows"></div>
                <div class="check-bar" id="inputTotalCheck">Toplam: 0 / 13</div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-action btn-gray" onclick="closeModal('inputModal')">İptal</button>
                <button class="btn-modal-action btn-green-batak" id="btnInputSave" onclick="saveRound()" disabled>KAYDET</button>
            </div>
        </div>
    </div>

    <!-- Düzenleme Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-title">Eli Düzenle</div>
            <div class="game-panel">
                <div id="editInputRows"></div>
                <div class="check-bar" id="editTotalCheck"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-action btn-gray" onclick="closeModal('editModal')">İptal</button>
                <button class="btn-modal-action btn-green-batak" id="btnEditSave" onclick="saveEditRound()">GÜNCELLE</button>
            </div>
        </div>
    </div>

    <!-- Puan Tablosu Modal -->
    <div class="modal" id="sheetModal">
        <div class="modal-sheet">
            <div class="modal-title">Puan Tablosu</div>
            <div id="sheetContent" style="flex:1; overflow:auto;"></div>
            <button onclick="closeModal('sheetModal')" style="width:100%; padding:12px; margin-top:10px; border:none; background:#eee; border-radius:8px; flex-shrink:0;">Kapat</button>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div class="custom-dialog" id="customDialog">
        <div class="dialog-box">
            <h3 id="dTitle"></h3>
            <p id="dMsg"></p>
            <div id="dActions" class="d-actions"></div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        const APP_VERSION = '1.1.0';
        setFooterVersion(APP_VERSION);

        const POSITIONS = ['pos-bottom', 'pos-right', 'pos-top', 'pos-left'];

        let gameState = {
            version: APP_VERSION,
            gameType: 'ihaleli',
            players: [],
            scores: [],
            history: [],
            gameActive: false
        };

        let inputState = { values: [0,0,0,0] };
        let editState  = { index: null, values: [0,0,0,0] };
        let selectedGameType = 'ihaleli';

        window.onload = loadState;

        // Player card tıklaması
        document.addEventListener('click', e => {
            const card = e.target.closest('.player-card');
            if (card && gameState.gameActive) {
                const index = parseInt(card.getAttribute('data-index'));
                openInputModal(index);
            }
        });

        // --- SETUP ---
        function selectGameType(type, btn) {
            selectedGameType = type;
            document.querySelectorAll('.gt-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            const p = [document.getElementById('p0'), document.getElementById('p1'),
                       document.getElementById('p2'), document.getElementById('p3')];

            if (type === 'gommeli') {
                p[2].value = "---"; p[2].disabled = true;
                document.querySelector('.pos-top').style.opacity = "0.3";
                p[0].value = "Ben";  p[0].disabled = false;
                p[1].value = "Sağ";  p[1].disabled = false;
                p[3].value = "Sol";  p[3].disabled = false;
            } else if (type === 'esli') {
                p[2].disabled = false; document.querySelector('.pos-top').style.opacity = "1";
                p[0].value = "Biz";   p[0].disabled = true;
                p[2].value = "Biz";   p[2].disabled = true;
                p[1].value = "Rakip"; p[1].disabled = true;
                p[3].value = "Rakip"; p[3].disabled = true;
            } else {
                p[2].disabled = false; document.querySelector('.pos-top').style.opacity = "1";
                p[0].value = "Ben";   p[0].disabled = false;
                p[1].value = "Sağ";   p[1].disabled = false;
                p[2].value = "Karşı"; p[2].disabled = false;
                p[3].value = "Sol";   p[3].disabled = false;
            }
        }

        function startGame() {
            gameState.gameType = selectedGameType;
            gameState.players = ['p0','p1','p2','p3'].map(id => document.getElementById(id).value);
            gameState.scores = [0,0,0,0];
            gameState.history = [];
            gameState.gameActive = true;
            gameState.version = APP_VERSION;
            updateUI(); saveState();
        }

        // --- INPUT MODAL ---
        function openInputModal(preSelectedBidderIndex = null) {
            const isKozMaca = gameState.gameType === 'kozmaca';
            document.getElementById('bidSection').style.display = isKozMaca ? 'none' : 'block';

            const bidderSel = document.getElementById('bidderSelect');
            bidderSel.innerHTML = '';
            gameState.players.forEach((p, i) => {
                if (gameState.gameType === 'gommeli' && i === 2) return;
                bidderSel.appendChild(new Option(p, i));
            });
            if (preSelectedBidderIndex !== null) bidderSel.value = preSelectedBidderIndex;

            const bidAmountSel = document.getElementById('bidAmountSelect');
            bidAmountSel.innerHTML = '';
            const minBid = gameState.gameType === 'gommeli' ? 8 : 5;
            const maxBid = gameState.gameType === 'gommeli' ? 16 : 13;
            for (let i = minBid; i <= maxBid; i++) bidAmountSel.appendChild(new Option(i, i));

            inputState.values = [0,0,0,0];
            renderInputs('inputRows', false);
            validateInputs(false);
            openModal('inputModal');
        }

        function renderInputs(containerId, isEdit) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const vals = isEdit ? editState.values : inputState.values;

            gameState.players.forEach((p, i) => {
                if (gameState.gameType === 'gommeli' && i === 2) return;
                const row = document.createElement('div');
                row.className = 'input-row';
                row.innerHTML = `
                    <div class="input-name">${p}</div>
                    <div class="input-controls">
                        <button class="btn-math" onclick="changeVal(${i}, -1, ${isEdit})">−</button>
                        <div class="val-box" id="${isEdit?'edit-':''}val-${i}">${vals[i]}</div>
                        <button class="btn-math" onclick="changeVal(${i}, 1, ${isEdit})">+</button>
                    </div>`;
                container.appendChild(row);
            });
        }

        function changeVal(i, delta, isEdit) {
            const vals = isEdit ? editState.values : inputState.values;
            const max  = gameState.gameType === 'gommeli' ? 16 : 13;
            const newVal = vals[i] + delta;
            if (newVal < 0 || newVal > max) return;
            vals[i] = newVal;
            document.getElementById(`${isEdit?'edit-':''}val-${i}`).textContent = newVal;
            validateInputs(isEdit);
        }

        function validateInputs(isEdit) {
            const vals   = isEdit ? editState.values : inputState.values;
            const total  = vals.reduce((a,b) => a+b, 0);
            const target = gameState.gameType === 'gommeli' ? 16 : 13;
            const bar = document.getElementById(isEdit ? 'editTotalCheck' : 'inputTotalCheck');
            const btn = document.getElementById(isEdit ? 'btnEditSave' : 'btnInputSave');
            bar.textContent = `Toplam: ${total} / ${target}`;
            bar.className = `check-bar ${total === target ? 'ok' : 'err'}`;
            btn.disabled = total !== target;
        }

        function saveRound() {
            const bidder = parseInt(document.getElementById('bidderSelect').value);
            const bid    = parseInt(document.getElementById('bidAmountSelect').value);
            const tricks = inputState.values;
            let points   = [0,0,0,0];

            if (gameState.gameType === 'kozmaca') {
                gameState.players.forEach((_, i) => {
                    if (gameState.gameType === 'gommeli' && i === 2) return;
                    points[i] = tricks[i] === 0 ? -50 : tricks[i] * 10;
                });
            } else {
                gameState.players.forEach((_, i) => {
                    if (gameState.gameType === 'gommeli' && i === 2) return;
                    if (i === bidder) points[i] = tricks[i] >= bid ? (bid*10)+((tricks[i]-bid)*10) : -(bid*10);
                    else points[i] = tricks[i] === 0 ? -50 : tricks[i] * 10;
                });
            }

            if (gameState.gameType === 'esli') {
                const t1 = points[0]+points[2], t2 = points[1]+points[3];
                points[0] = t1; points[2] = t1; points[1] = t2; points[3] = t2;
            }

            for (let i=0; i<4; i++) gameState.scores[i] += points[i];
            gameState.history.push({
                bidder: gameState.gameType === 'kozmaca' ? -1 : bidder,
                bid:    gameState.gameType === 'kozmaca' ? 0 : bid,
                tricks: [...tricks], points
            });
            closeModal('inputModal'); updateUI(); saveState();
        }

        function openEditModal(index) {
            const h = gameState.history[index];
            editState.index = index;
            editState.values = [...h.tricks];
            renderInputs('editInputRows', true);
            validateInputs(true);
            openModal('editModal');
        }

        function saveEditRound() {
            const idx  = editState.index;
            const oldH = gameState.history[idx];
            for (let i=0; i<4; i++) gameState.scores[i] -= oldH.points[i];

            const tricks = editState.values;
            const bidder = oldH.bidder, bid = oldH.bid;
            let points = [0,0,0,0];

            if (gameState.gameType === 'kozmaca') {
                gameState.players.forEach((_, i) => {
                    if (gameState.gameType === 'gommeli' && i === 2) return;
                    points[i] = tricks[i] === 0 ? -50 : tricks[i] * 10;
                });
            } else {
                gameState.players.forEach((_, i) => {
                    if (gameState.gameType === 'gommeli' && i === 2) return;
                    if (i === bidder) points[i] = tricks[i] >= bid ? (bid*10)+((tricks[i]-bid)*10) : -(bid*10);
                    else points[i] = tricks[i] === 0 ? -50 : tricks[i] * 10;
                });
            }
            if (gameState.gameType === 'esli') {
                const t1 = points[0]+points[2], t2 = points[1]+points[3];
                points[0] = t1; points[2] = t1; points[1] = t2; points[3] = t2;
            }

            for (let i=0; i<4; i++) gameState.scores[i] += points[i];
            gameState.history[idx].tricks = tricks;
            gameState.history[idx].points = points;
            closeModal('editModal'); updateUI(); saveState();
        }

        function deleteRound(index) {
            if (index !== gameState.history.length - 1) { alert("Sadece son el silinebilir"); return; }
            showDialog("Eli Sil", "Puanlar geri alınacak.", yes => {
                if (yes) {
                    const h = gameState.history[index];
                    for (let i=0; i<4; i++) gameState.scores[i] -= h.points[i];
                    gameState.history.splice(index, 1);
                    updateUI(); saveState();
                }
            }, "danger");
        }

        function openSheetModal() {
            const grandTotal = [0,0,0,0];
            let html = `<table class="score-table"><thead><tr><th>EL</th>`;
            gameState.players.forEach(p => html += `<th>${p.substr(0,3)}</th>`);
            html += `</tr></thead><tbody>`;
            gameState.history.forEach((h, idx) => {
                html += `<tr><td>${idx+1}</td>`;
                for (let i=0; i<4; i++) { grandTotal[i] += h.points[i]; html += `<td>${h.points[i]}</td>`; }
                html += `</tr>`;
            });
            html += `<tr class="total-row"><td>TOP</td>`;
            grandTotal.forEach(t => html += `<td>${t}</td>`);
            html += `</tr></tbody></table>`;
            document.getElementById('sheetContent').innerHTML = html;
            openModal('sheetModal');
        }

        function updateUI() {
            const setup = document.getElementById('setupSection');
            const board = document.getElementById('scoreboard');
            if (!gameState.gameActive) { setup.classList.add('active'); board.classList.remove('active'); return; }
            setup.classList.remove('active'); board.classList.add('active');

            const table  = document.getElementById('gameTable');
            const center = document.querySelector('.pos-center');
            table.innerHTML = ''; table.appendChild(center);

            gameState.players.forEach((p, i) => {
                if (gameState.gameType === 'gommeli' && i === 2) return;
                const card = document.createElement('div');
                card.className = `player-card ${POSITIONS[i]}`;
                card.setAttribute('data-index', i);
                if (gameState.gameType === 'esli') card.classList.add(i%2===0 ? 'team-a' : 'team-b');
                card.innerHTML = `<div class="p-name">${p}</div><div class="p-score">${gameState.scores[i]}</div>`;
                table.appendChild(card);
            });

            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (gameState.history.length === 0) list.innerHTML = '<div style="color:#ccc; font-size:11px; text-align:center; padding:10px;">Henüz el girilmedi</div>';

            [...gameState.history].reverse().forEach((h, idx) => {
                const realIdx = gameState.history.length - 1 - idx;
                const info    = gameState.gameType === 'kozmaca' ? 'Koz Maça' : `${gameState.players[h.bidder]} (${h.bid})`;
                let details = '';
                h.tricks.forEach((t, i) => { if (gameState.gameType === 'gommeli' && i === 2) return; details += `${gameState.players[i]}:${t} `; });
                const delBtn = realIdx === gameState.history.length-1 ? `<button class="btn-small btn-del" onclick="deleteRound(${realIdx})">SİL</button>` : '';
                list.innerHTML += `
                    <div class="h-item">
                        <div class="h-left"><div class="h-header"><span>${realIdx+1}. El</span><span class="h-bid-info">${info}</span></div><div class="h-details">${details}</div></div>
                        <div class="h-actions"><button class="btn-small btn-edit" onclick="openEditModal(${realIdx})">DZN</button>${delBtn}</div>
                    </div>`;
            });
        }

        function saveState() { localStorage.setItem('batakStatev1', JSON.stringify(gameState)); }
        function loadState() {
            const s = localStorage.getItem('batakStatev1');
            if (s) { try { gameState = JSON.parse(s); updateUI(); } catch(e){} }
        }
        function resetGame() {
            showDialog("Sıfırla", "Her şey silinsin mi?", y => {
                if (y) { localStorage.removeItem('batakStatev1'); window.location.reload(); }
            }, "danger");
        }
        function goHome() {
            if (gameState.gameActive) showDialog("Çıkış", "Menüye dön?", y => { if(y) window.location.href='index.html'; }, "normal");
            else window.location.href = 'index.html';
        }

        function showDialog(title, msg, callback, type) {
            document.getElementById('dTitle').textContent = title;
            document.getElementById('dMsg').textContent = msg;
            const act = document.getElementById('dActions');
            act.innerHTML = '';
            const box = document.getElementById('customDialog');
            const b1 = document.createElement('button'); b1.className = 'd-btn d-cancel'; b1.textContent = "Vazgeç";
            b1.onclick = () => { box.classList.remove('active'); if(callback) callback(false); };
            const b2 = document.createElement('button'); b2.className = 'd-btn ' + (type === 'danger' ? 'd-danger' : 'd-confirm');
            b2.textContent = "Onayla"; b2.onclick = () => { box.classList.remove('active'); if(callback) callback(true); };
            act.appendChild(b1); act.appendChild(b2);
            box.classList.add('active');
        }
    </script>
</body>
</html>
