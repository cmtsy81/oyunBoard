<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyunlar & Araçlar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .menu-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr; /* Telefonta tek sütun */
            gap: 15px;
        }

        /* Tablet ve üstü için 2 sütun olabilir */
        @media (min-width: 480px) {
            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .menu-card {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .card-icon {
            font-size: 32px;
            margin-right: 15px;
            background: #f0f2ff;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .card-content h3 {
            font-size: 16px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .card-content p {
            font-size: 12px;
            color: #666;
        }

        .version {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Ana Menü</h1>
            <p>Oyunlar ve yardımcı araçlar</p>
        </div>

        <div class="menu-grid">
            
            <a href="okeyDuz.html" class="menu-card">
                <div class="card-icon">🃏</div>
                <div class="card-content">
                    <h3>Okey Skor</h3>
                    <p>Düşmeli skor takibi</p>
                </div>
            </a>

            </div>

        <div class="version">
            v1.0
        </div>
    </div>

</body>
</html>
