<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King Skor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; overscroll-behavior-y: contain; }
        .container { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            color: #2c3e50;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 { font-size: 20px; font-weight: 800; margin-bottom: 2px; margin: 0; }
        .header-right { display: flex; gap: 15px; }
        .btn-icon { background: none; border: none; color: #2c3e50; font-size: 32px; cursor: pointer; padding: 0; transition: transform 0.2s; }
        .btn-icon:active { transform: scale(0.9); }

        .content { flex: 1; padding: 16px; overflow-y: auto; }

        /* SETUP */
        .setup-section { display: none; }
        .setup-section.active { display: block; }
        .table-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .pos-top { grid-column: 2; grid-row: 1; }
        .pos-left { grid-column: 1; grid-row: 2; }
        .pos-right { grid-column: 3; grid-row: 2; }
        .pos-bottom { grid-column: 2; grid-row: 3; }
        .pos-center { grid-column: 2; grid-row: 2; min-height: 100px; display: flex; align-items: center; justify-content: center; z-index: 5; }

        .setup-input-wrapper { text-align: center; }
        .setup-label { font-size: 11px; font-weight: bold; color: #95a5a6; margin-bottom: 4px; display: block; }
        .player-name-input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-weight: 600; color: #2c3e50; }
        .btn-start { width: 100%; padding: 14px; background: #f39c12; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;}

        /* SCOREBOARD */
        .scoreboard { display: none; }
        .scoreboard.active { display: block; }

        .player-card {
            background: white; border: 2px solid #eee; border-radius: 10px; padding: 8px;
            position: relative; transition: all 0.3s; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 12px;
        }
        .player-card.active-turn {
            border-color: #f39c12; background: #fffbf0;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); transform: scale(1.05);
            z-index: 2; cursor: pointer;
        }
        .crown-icon { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 20px; display: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }
        .player-card.active-turn .crown-icon { display: block; animation: bounce 1s infinite; }

        .p-name { font-weight: bold; color: #2c3e50; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-score { font-size: 18px; font-weight: 800; color: #f39c12; margin-bottom: 4px; }
        .p-rights { display: flex; justify-content: center; gap: 3px; }
        .dot { width: 6px; height: 6px; background: #ecf0f1; border: 1px solid #bdc3c7; }
        .dot.ceza { border-radius: 50%; } .dot.koz { border-radius: 0; }
        .dot.filled-ceza { background: #e74c3c; border-color: #c0392b; }
        .dot.filled-koz { background: #27ae60; border-color: #2ecc71; }

        /* CENTER INFO */
        .center-info { text-align: center; color: #bdc3c7; font-size: 11px; font-weight: bold; line-height: 1.4; }

        /* MODALS & PANELS */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-sheet { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 95vh; overflow-y: auto; animation: slideUp 0.3s ease; display: flex; flex-direction: column; }
        .modal-content { background: white; border-radius: 12px 12px 0 0; padding: 20px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }

        /* GAME PANEL (YELLOW) */
        .game-panel { background: #fff8e1; padding: 15px; border-radius: 10px; border: 1px solid #ffe082; margin-bottom: 0; }
        .panel-title { font-size: 14px; color: #d35400; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; }

        /* GAME SELECT GRID */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .g-btn { padding: 15px; border: 1px solid #eee; background: #f9f9f9; border-radius: 10px; font-weight: 600; color: #555; cursor: pointer; text-align: center; position: relative;}
        .g-btn.koz { border-color: #27ae60; color: #27ae60; background: #e8f8f5; }
        .g-btn:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: line-through; }
        .g-limit-badge { position: absolute; top: 2px; right: 5px; font-size: 9px; color: #e74c3c; font-weight: bold; }

        /* INPUT ROWS */
        .input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .input-name { font-weight: 600; font-size: 12px; width: 60px; text-align: left; color: #2c3e50; }
        .input-controls { display: flex; align-items: center; gap: 8px; }
        .btn-math { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd; background: white; font-weight: bold; cursor: pointer; color: #2c3e50; }
        .val-box { font-size: 16px; font-weight: bold; width: 24px; text-align: center; color: #2c3e50; }
        
        .check-bar { text-align: center; margin: 10px 0; font-size: 11px; font-weight: bold; color: #95a5a6; }
        .check-bar.ok { color: #27ae60; }
        .check-bar.err { color: #e74c3c; }
        
        /* MODAL ACTION BUTTONS */
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-modal-action { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-gray { background: #ecf0f1; color: #2c3e50; }
        .btn-orange { background: #f39c12; color: white; }
        .btn-orange:disabled { background: #bdc3c7; cursor: not-allowed; opacity: 0.7; color: white; }

        /* HISTORY */
        .history-area { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .h-item { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee; margin-bottom: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #f39c12; }
        .btn-small { padding: 6px 12px; border-radius: 4px; border: none; color: white; font-size: 11px; cursor: pointer; font-weight: 600; margin-left: 4px; }
        .btn-edit { background: #3498db; } .btn-del { background: #e74c3c; }

        /* TABLE SHEET STYLES */
        .score-table-container { overflow-x: auto; margin-bottom: 20px; }
        .score-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        .score-table th { background: #f39c12; color: white; padding: 8px 2px; font-weight: bold; }
        .score-table td { border-bottom: 1px solid #eee; padding: 6px 2px; color: #2c3e50; }
        .score-table tr:nth-child(even) { background: #f9f9f9; }
        .score-table .total-row { font-weight: bold; background: #ecf0f1 !important; color: #d35400; }
        .score-table .game-col { text-align: left; padding-left: 5px; font-weight: 600; }

        /* DIALOG */
        .custom-dialog { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center; }
        .custom-dialog.active { display: flex; }
        .dialog-box { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        .d-actions { display: flex; gap: 10px; margin-top: 15px; }
        .d-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .d-confirm { background: #e74c3c; color: white; }
        .d-cancel { background: #27ae60; color: white; }
        .d-danger { background: #e74c3c; color: white; }

        .footer-version { text-align: center; padding: 10px; font-size: 11px; color: #aaa; border-top: 1px solid #eee; margin-top: auto; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="btn-icon" onclick="goHome()">🏠</button>
            <h1>KING</h1>
            <div class="header-right">
                <button class="btn-icon" onclick="openSheetModal()" title="Puan Tablosu">📊</button>
                <button class="btn-icon" onclick="resetGame()" title="Sıfırla">🔄</button>
            </div>
        </div>

        <div class="content">
            <div class="setup-section active" id="setupSection">
                <div class="table-layout">
                    <div class="pos-top setup-input-wrapper"><label class="setup-label">Karşı</label><input type="text" class="player-name-input" id="p2" value="Karşı"></div>
                    <div class="pos-left setup-input-wrapper"><label class="setup-label">Sol</label><input type="text" class="player-name-input" id="p3" value="Sol"></div>
                    <div class="pos-center" style="opacity:0.3; font-weight:bold;">MASA</div>
                    <div class="pos-right setup-input-wrapper"><label class="setup-label">Sağ</label><input type="text" class="player-name-input" id="p1" value="Sağ"></div>
                    <div class="pos-bottom setup-input-wrapper"><label class="setup-label">Ben</label><input type="text" class="player-name-input" id="p0" value="Ben"></div>
                </div>
                <button class="btn-start" onclick="startGame()">Oyunu Başlat</button>
            </div>

            <div class="scoreboard" id="scoreboard">
                <div class="table-layout" id="gameTable">
                    <div class="pos-center">
                        <div class="center-info" id="centerPlaceholder">
                            SIRASI GELEN OYUNCUYA<br>TIKLAYIP OYUN SEÇİN
                        </div>
                    </div>
                </div>

                <div class="history-area">
                    <div style="font-size:12px; font-weight:bold; color:#95a5a6; margin-bottom:5px;">GEÇMİŞ ELLER</div>
                    <div id="historyList">
                        <div style="color:#ccc; font-size:11px; text-align:center; padding:10px;">Henüz el girilmedi</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-version" id="footerVersion">v1.4.2</div>
    </div>

    <div class="modal" id="gameSelectModal">
        <div class="modal-sheet">
            <div style="text-align:center; margin-bottom:15px; font-weight:bold; font-size:16px;"><span id="modalPlayerName" style="color:#f39c12;"></span> Ne Oynuyor?</div>
            <div class="game-grid" id="gameSelectGrid"></div>
            <button onclick="closeModal('gameSelectModal')" style="width:100%; padding:12px; margin-top:15px; border:none; background:#e74c3c; color:white; border-radius:8px; font-weight:bold;">Vazgeç</button>
        </div>
    </div>

    <div class="modal" id="inputModal">
        <div class="modal-content">
            <div style="font-weight:bold; margin-bottom:15px; font-size:16px; color:#2c3e50;">Skorları Gir</div>
            <div class="game-panel">
                <div class="panel-title" id="inputGameTitle"></div>
                <div id="inputRows"></div>
                <div class="check-bar" id="inputTotalCheck"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-action btn-gray" onclick="closeModal('inputModal')">İptal</button>
                <button class="btn-modal-action btn-orange" id="btnInputSave" onclick="saveRound()" disabled>KAYDET</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div style="font-weight:bold; margin-bottom:15px; font-size:16px; color:#2c3e50;">Eli Düzenle</div>
            <div class="game-panel">
                <div class="panel-title" id="editGameNameDisplay"></div>
                <div id="editPlayerInputs"></div>
                <div class="check-bar" id="editTotalCheck"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-action btn-gray" onclick="closeModal('editModal')">İptal</button>
                <button class="btn-modal-action btn-orange" id="btnEditSave" onclick="saveEditRound()">GÜNCELLE</button>
            </div>
        </div>
    </div>

    <div class="modal" id="sheetModal">
        <div class="modal-sheet">
            <div style="text-align:center; font-weight:bold; font-size:16px; margin-bottom:10px; color:#2c3e50;">Puan Tablosu</div>
            <div id="sheetContent" style="flex:1; overflow:auto;"></div>
            <button onclick="closeModal('sheetModal')" style="width:100%; padding:12px; margin-top:10px; border:none; background:#eee; border-radius:8px; flex-shrink:0;">Kapat</button>
        </div>
    </div>

    <div class="custom-dialog" id="customDialog">
        <div class="dialog-box">
            <h3 id="dTitle" style="margin:0 0 10px 0;"></h3>
            <p id="dMsg" style="color:#666; font-size:14px;"></p>
            <div id="dActions" class="d-actions"></div>
        </div>
    </div>

    <script>
        const APP_VERSION = '1.4.2';
        document.getElementById('footerVersion').textContent = 'v' + APP_VERSION;

        const GAME_RULES = {
            'el':     { name: 'El Almaz',    points: -50,  target: 13, type: 'ceza', globalLimit: 2 },
            'kupa':   { name: 'Kupa Almaz',  points: -30,  target: 13, type: 'ceza', globalLimit: 2 },
            'erkek':  { name: 'Erkek Almaz', points: -60,  target: 8,  type: 'ceza', globalLimit: 2 },
            'kiz':    { name: 'Kız Almaz',   points: -100, target: 4,  type: 'ceza', globalLimit: 2 },
            'rifki':  { name: 'Rıfkı',       points: -320, target: 1,  type: 'ceza', globalLimit: 2 },
            'soniki': { name: 'Son İki',     points: -180, target: 2,  type: 'ceza', globalLimit: 2 },
            'koz':    { name: 'KOZ',         points: 50,   target: 13, type: 'koz',  globalLimit: 99 }
        };

        const POSITIONS = ['pos-bottom', 'pos-right', 'pos-top', 'pos-left'];

        let gameState = {
            version: APP_VERSION,
            players: [],
            scores: [0,0,0,0],
            rights: Array(4).fill().map(() => ({ ceza: 0, koz: 0 })),
            turnIndex: 0,
            history: [],
            gameActive: false
        };

        let currentRound = { gameType: null, values: [0,0,0,0] };
        let editState = { roundIndex: null, values: [0,0,0,0] };

        window.onload = loadState;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        document.addEventListener('click', e => {
            if(e.target.closest('button') || e.target.closest('.player-card.active-turn')) {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        });

        function startGame() {
            const pNames = [];
            for(let i=0; i<4; i++) pNames.push(document.getElementById('p'+i).value || 'O'+(i+1));
            gameState.players = pNames;
            gameState.scores = [0,0,0,0];
            gameState.rights = Array(4).fill().map(() => ({ ceza: 0, koz: 0 }));
            gameState.history = [];
            gameState.turnIndex = 0;
            gameState.gameActive = true;
            gameState.version = APP_VERSION;
            showDialog("Kim Başlıyor?", "Sıra kimde?", (confirmed) => { if(!confirmed) return; }, "start");
        }

        function startWithPlayer(index) {
            gameState.turnIndex = index;
            document.getElementById('customDialog').classList.remove('active');
            updateUI();
            saveState();
        }

        function onPlayerClick(index) {
            if(index !== gameState.turnIndex) return;
            openGameSelectModal();
        }

        function openGameSelectModal() {
            const playerIdx = gameState.turnIndex;
            document.getElementById('modalPlayerName').textContent = gameState.players[playerIdx];
            const grid = document.getElementById('gameSelectGrid');
            grid.innerHTML = '';
            const rights = gameState.rights[playerIdx];

            for(let key in GAME_RULES) {
                const rule = GAME_RULES[key];
                const btn = document.createElement('button');
                btn.className = 'g-btn' + (rule.type === 'koz' ? ' koz' : '');
                btn.textContent = rule.name;
                
                const currentUsage = rights[rule.type];
                const limit = rule.type === 'ceza' ? 3 : 2;
                let disabled = false;
                
                if(currentUsage >= limit) disabled = true;
                const globalCount = gameState.history.filter(h => h.type === key).length;
                if(rule.type === 'ceza' && globalCount >= rule.globalLimit) disabled = true;

                if(disabled) {
                    btn.disabled = true;
                    btn.style.textDecoration = "line-through";
                }
                btn.onclick = () => selectGame(key);
                grid.appendChild(btn);
            }
            document.getElementById('gameSelectModal').classList.add('active');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function selectGame(type) {
            closeModal('gameSelectModal');
            currentRound.gameType = type;
            currentRound.values = [0,0,0,0];
            
            document.getElementById('inputGameTitle').textContent = GAME_RULES[type].name;
            renderInputs('inputRows', false);
            validateInputs(false);
            document.getElementById('inputModal').classList.add('active');
        }

        function renderInputs(containerId, isEdit) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const vals = isEdit ? editState.values : currentRound.values;
            
            gameState.players.forEach((p, i) => {
                const row = document.createElement('div');
                row.className = 'input-row';
                row.innerHTML = `
                    <div class="input-name">${p}</div>
                    <div class="input-controls">
                        <button class="btn-math" onclick="changeVal(${i}, -1, ${isEdit})">-</button>
                        <div class="val-box" id="${isEdit?'edit-':''}val-${i}">${vals[i]}</div>
                        <button class="btn-math" onclick="changeVal(${i}, 1, ${isEdit})">+</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function changeVal(pIndex, delta, isEdit) {
            const vals = isEdit ? editState.values : currentRound.values;
            const newVal = vals[pIndex] + delta;
            if(newVal < 0) return;
            vals[pIndex] = newVal;
            document.getElementById(`${isEdit?'edit-':''}val-${pIndex}`).textContent = newVal;
            validateInputs(isEdit);
        }

        function validateInputs(isEdit) {
            const type = isEdit ? gameState.history[editState.roundIndex].type : currentRound.gameType;
            const vals = isEdit ? editState.values : currentRound.values;
            const rule = GAME_RULES[type];
            const total = vals.reduce((a,b) => a+b, 0);
            
            const bar = document.getElementById(isEdit ? 'editTotalCheck' : 'inputTotalCheck');
            const btn = document.getElementById(isEdit ? 'btnEditSave' : 'btnInputSave');
            
            bar.textContent = `Toplam: ${total} / ${rule.target}`;
            if(total === rule.target) {
                bar.className = 'check-bar ok'; 
                btn.disabled = false;
            } else {
                bar.className = 'check-bar err'; 
                btn.disabled = true;
            }
        }

        function saveRound() {
            const type = currentRound.gameType;
            const rule = GAME_RULES[type];
            const pointsArr = currentRound.values.map(v => v * rule.points);
            const callerIdx = gameState.turnIndex;

            for(let i=0; i<4; i++) gameState.scores[i] += pointsArr[i];
            gameState.rights[callerIdx][rule.type]++;
            
            gameState.history.push({ type, caller: callerIdx, inputs: [...currentRound.values], points: pointsArr });

            gameState.turnIndex = (gameState.turnIndex + 1) % 4;
            closeModal('inputModal');
            updateUI();
            saveState();
        }

        function openEditModal(index) {
            const round = gameState.history[index];
            editState.roundIndex = index;
            editState.values = [...round.inputs];
            document.getElementById('editGameNameDisplay').textContent = GAME_RULES[round.type].name;
            renderInputs('editPlayerInputs', true);
            validateInputs(true);
            document.getElementById('editModal').classList.add('active');
        }

        function saveEditRound() {
            const index = editState.roundIndex;
            const oldRound = gameState.history[index];
            const rule = GAME_RULES[oldRound.type];

            for(let i=0; i<4; i++) gameState.scores[i] -= oldRound.points[i];
            const newPoints = editState.values.map(v => v * rule.points);
            for(let i=0; i<4; i++) gameState.scores[i] += newPoints[i];

            gameState.history[index].inputs = [...editState.values];
            gameState.history[index].points = newPoints;

            closeModal('editModal');
            updateUI();
            saveState();
        }

        function deleteRound(index) {
            if(index !== gameState.history.length - 1) {
                showDialog("Hata", "Sadece en son girilen el silinebilir!", null, "alert");
                return;
            }
            showDialog("Eli Sil", "Puanlar geri alınacak ve sıra geri dönecek.", (yes) => {
                if(yes) {
                    const h = gameState.history[index];
                    const rule = GAME_RULES[h.type];
                    for(let i=0; i<4; i++) gameState.scores[i] -= h.points[i];
                    gameState.rights[h.caller][rule.type]--;
                    gameState.turnIndex = h.caller;
                    gameState.history.splice(index, 1);
                    updateUI();
                    saveState();
                }
            }, "danger");
        }

        function openSheetModal() {
            const totals = {};
            const grandTotal = [0,0,0,0];
            for(let key in GAME_RULES) totals[key] = [0,0,0,0];

            gameState.history.forEach(h => {
                for(let i=0; i<4; i++) {
                    totals[h.type][i] += h.points[i];
                    grandTotal[i] += h.points[i];
                }
            });

            let html = `<table class="score-table"><thead><tr><th>OYUN</th>`;
            gameState.players.forEach(p => html += `<th>${p.substr(0,3)}</th>`);
            html += `</tr></thead><tbody>`;

            for(let key in GAME_RULES) {
                const rule = GAME_RULES[key];
                html += `<tr><td class="game-col">${rule.name}</td>`;
                for(let i=0; i<4; i++) html += `<td>${totals[key][i]}</td>`;
                html += `</tr>`;
            }
            
            html += `<tr class="total-row"><td class="game-col">TOPLAM</td>`;
            grandTotal.forEach(t => html += `<td>${t}</td>`);
            html += `</tr></tbody></table>`;

            document.getElementById('sheetContent').innerHTML = html;
            document.getElementById('sheetModal').classList.add('active');
        }

        function updateUI() {
            if(!gameState.gameActive) {
                document.getElementById('setupSection').classList.add('active');
                document.getElementById('scoreboard').classList.remove('active');
                return;
            }
            document.getElementById('setupSection').classList.remove('active');
            document.getElementById('scoreboard').classList.add('active');

            const table = document.getElementById('gameTable');
            const center = document.querySelector('.pos-center');
            table.innerHTML = ''; table.appendChild(center);

            gameState.players.forEach((p, i) => {
                const isTurn = (i === gameState.turnIndex);
                const rights = gameState.rights[i];
                let dots = '';
                for(let c=0; c<3; c++) dots += `<div class="dot ceza ${c < rights.ceza ? 'filled-ceza':''}"></div>`;
                dots += '<div style="width:3px"></div>';
                for(let k=0; k<2; k++) dots += `<div class="dot koz ${k < rights.koz ? 'filled-koz':''}"></div>`;

                const card = document.createElement('div');
                card.className = `player-card ${POSITIONS[i]} ${isTurn ? 'active-turn' : ''}`;
                card.onclick = () => onPlayerClick(i);
                card.innerHTML = `<div class="crown-icon">👑</div><div class="p-name">${p}</div><div class="p-score">${gameState.scores[i]}</div><div class="p-rights">${dots}</div>`;
                table.appendChild(card);
            });

            const hList = document.getElementById('historyList');
            hList.innerHTML = '';
            
            if(gameState.history.length === 0) {
                hList.innerHTML = '<div style="color:#ccc; font-size:11px; text-align:center; padding:10px;">Henüz el girilmedi</div>';
            }

            [...gameState.history].reverse().forEach((h, idx) => {
                const realIdx = gameState.history.length - 1 - idx;
                const rule = GAME_RULES[h.type];
                let detail = "";
                h.inputs.forEach((v, pI) => { if(v>0) detail += `${gameState.players[pI]}:${v} `; });
                
                let deleteBtn = '';
                if(realIdx === gameState.history.length - 1) {
                    deleteBtn = `<button class="btn-small btn-del" onclick="deleteRound(${realIdx})">SİL</button>`;
                }

                hList.innerHTML += `
                    <div class="h-item">
                        <div><span style="font-weight:bold; color:#2c3e50;">${realIdx+1}. ${rule.name}</span> <span style="font-size:10px; color:#e67e22;">(${gameState.players[h.caller]})</span><div style="color:#888;">${detail}</div></div>
                        <div><button class="btn-small btn-edit" onclick="openEditModal(${realIdx})">DZN</button>${deleteBtn}</div>
                    </div>
                `;
            });
        }

        function saveState() { localStorage.setItem('kingGamev14', JSON.stringify(gameState)); }
        
        function loadState() {
            const s = localStorage.getItem('kingGamev14');
            if(s) { 
                try { 
                    const p = JSON.parse(s); 
                    if(p.version === APP_VERSION) { gameState = p; updateUI(); } 
                } catch(e){} 
            } else {
                const old = localStorage.getItem('kingGamev13');
                if(old) {
                    try {
                        const p = JSON.parse(old);
                        gameState = p;
                        gameState.version = APP_VERSION;
                        updateUI();
                        saveState();
                    } catch(e) {}
                }
            }
        }
        
        function resetGame() { showDialog("Sıfırla", "Yeni oyun?", (y) => { if(y) { localStorage.removeItem('kingGamev14'); localStorage.removeItem('kingGamev13'); window.location.reload(); } }, "danger"); }
        function goHome() { if(gameState.gameActive) showDialog("Çıkış", "Menüye dön?", (y)=>{if(y) window.location.href='index.html';}, "confirm"); else window.location.href='index.html'; }
        
        function showDialog(title, msg, callback, type) {
            const box = document.getElementById('customDialog');
            document.getElementById('dTitle').textContent = title;
            document.getElementById('dMsg').textContent = msg;
            const act = document.getElementById('dActions');
            act.innerHTML = '';
            if(type === "start") {
                gameState.players.forEach((p, i) => {
                    const b = document.createElement('button'); b.className = 'd-btn d-confirm'; b.style.margin = "2px"; b.textContent = p;
                    b.onclick = () => callback(startWithPlayer(i)); act.appendChild(b);
                });
            } else if(type === "alert") {
                 const b = document.createElement('button'); b.className = 'd-btn d-confirm'; b.textContent = "Tamam";
                 b.onclick = () => { box.classList.remove('active'); }; act.appendChild(b);
            } else {
                const b1 = document.createElement('button'); b1.className = 'd-btn d-cancel'; b1.textContent = "Vazgeç"; b1.onclick = () => { box.classList.remove('active'); callback(false); };
                const b2 = document.createElement('button'); b2.className = 'd-btn ' + (type === 'danger' ? 'd-danger' : 'd-confirm'); b2.textContent = "Onayla"; b2.onclick = () => { box.classList.remove('active'); callback(true); };
                act.appendChild(b1); act.appendChild(b2);
            }
            box.classList.add('active');
        }
    </script>
</body>
</html>
