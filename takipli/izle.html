<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canlı Skor İzle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding-bottom: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); /* Turuncu Tema */
            color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 10;
        }
        .header h1 { font-size: 20px; margin: 0; font-weight: 800; }
        .btn-home { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* GİRİŞ EKRANI */
        .login-screen { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; height: 80vh; }
        .login-input { padding: 15px; font-size: 24px; text-align: center; width: 200px; border: 2px solid #ddd; border-radius: 10px; letter-spacing: 5px; font-weight: bold; }
        .login-btn { padding: 15px 40px; background: #e67e22; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3); }
        
        /* OYUN EKRANI (Başta gizli) */
        .game-screen { display: none; padding: 15px; }
        .game-screen.active { display: block; }

        /* CANLI GÖSTERGESİ */
        .status-bar { 
            text-align: center; margin-bottom: 20px; padding: 10px; background: #fff3cd; 
            border-radius: 8px; font-size: 12px; color: #856404; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .live-dot { width: 8px; height: 8px; background: #e74c3c; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* SKOR KARTLARI */
        .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .s-card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .s-card.team-a { border-top: 4px solid #667eea; }
        .s-card.team-b { border-top: 4px solid #f093fb; }
        
        .s-name { font-size: 14px; color: #666; margin-bottom: 5px; font-weight: 600; }
        .s-point { font-size: 32px; font-weight: 800; color: #2c3e50; }

        /* GEÇMİŞ LİSTESİ */
        .history-area { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .h-item { 
            background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #eee;
            border-left: 4px solid #95a5a6; font-size: 13px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; 
        }
        .h-badge { padding: 2px 6px; background: #eee; border-radius: 4px; font-size: 10px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button class="btn-home" onclick="window.location.href='index.html'">🏠</button>
            <h1>Canlı Masa</h1>
            <div style="width: 30px;"></div> </div>

        <div class="login-screen" id="loginScreen">
            <div>
                <h2 style="color:#2c3e50; margin-bottom:10px;">Masa Kodunu Gir</h2>
                <p style="color:#999; font-size:14px;">Oyuncunun ekranındaki 6 haneli kod</p>
            </div>
            <input type="tel" id="masaInput" class="login-input" placeholder="123456" maxlength="6">
            <button class="login-btn" onclick="connectToMasa()">BAĞLAN</button>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="status-bar">
                <div class="live-dot"></div>
                <span id="statusText">Bağlantı Kuruluyor...</span>
            </div>

            <div class="score-grid" id="scoreGrid"></div>

            <div class="history-area">
                <h4 style="color:#2c3e50; margin-bottom:10px;">Oyun Geçmişi</h4>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        // !!! API AYARI !!!
        const API_URL = 'api.php'; 

        let pollingInterval = null;
        let currentMasaID = null;

        // Sayfa açılınca URL'de kod var mı bak (?masa=123456)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlMasa = urlParams.get('masa');
            if(urlMasa) {
                document.getElementById('masaInput').value = urlMasa;
                connectToMasa();
            }
        };

        function connectToMasa() {
            const kod = document.getElementById('masaInput').value.trim();
            if(kod.length < 4) { alert("Lütfen geçerli bir kod girin."); return; }

            currentMasaID = kod;
            
            // Ekranı Değiştir
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('statusText').innerText = "Veri aranıyor: " + kod;

            // İlk çekiş
            fetchData();

            // Periyodik döngüyü başlat (5 saniyede bir)
            if(pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(fetchData, 5000);
        }

        function fetchData() {
            fetch(`${API_URL}?islem=oku&masa_id=${currentMasaID}`)
            .then(res => res.json())
            .then(data => {
                if(data.durum === "yok" || data.hata) {
                    document.getElementById('statusText').innerText = "Masa bulunamadı veya kapalı.";
                    document.querySelector('.live-dot').style.backgroundColor = '#ccc'; // Gri yap
                } else {
                    updateDisplay(data);
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('statusText').innerText = "Bağlantı hatası / Offline";
            });
        }

        function updateDisplay(data) {
            // Durum Çubuğu
            const time = new Date().toLocaleTimeString();
            document.getElementById('statusText').innerText = `CANLI • Son Güncelleme: ${time}`;
            
            const grid = document.getElementById('scoreGrid');
            grid.innerHTML = '';

            // 4'lü Grid mi yoksa 2'li Takım mı?
            if(data.teamMode) {
                // Takım Modu (2 Kart Göster: Biz ve Rakip)
                // data.scores[0] -> Biz, data.scores[1] -> Rakip (Genelde)
                // Ancak veri yapısında 0 ve 2 aynı takım, 1 ve 3 aynı takım.
                // OkeyDuz yapısına göre scores arrayi 2 elemanlı oluyor teamMode true ise.
                
                const s1 = data.scores[0];
                const s2 = data.scores[1];

                grid.innerHTML += createCard("BİZ", s1, "team-a");
                grid.innerHTML += createCard("RAKİP", s2, "team-b");

            } else {
                // Bireysel Mod (4 Kart)
                // data.names sırası: [Ben(0), Sağ(1), Karşı(2), Sol(3)]
                // Masa düzenine göre sıralamak daha şık olur ama düz liste de ok
                
                data.names.forEach((name, idx) => {
                    grid.innerHTML += createCard(name, data.scores[idx], "");
                });
            }

            // Geçmiş Listesi
            const hList = document.getElementById('historyList');
            hList.innerHTML = '';
            
            if(data.history && data.history.length > 0) {
                // Sondan başa doğru (En yeni en üstte)
                [...data.history].reverse().forEach((h, idx) => {
                    const realIdx = data.history.length - idx;
                    
                    // Kazanan ismini bul
                    let winnerName = "";
                    if(data.teamMode) {
                        // Team mode'da winnerMask 0 veya 1 geliyor olabilir ya da oyuncu indexi.
                        // Bizim kaydettiğimiz yapıda winnerMask oyuncu indexiydi.
                        // Modulo alarak takımı bulalım.
                        const teamIdx = h.winnerMask % 2; 
                        winnerName = (teamIdx === 0) ? "BİZ" : "RAKİP";
                    } else {
                        winnerName = data.names[h.winnerMask];
                    }

                    const finishType = { 'normal': 'Normal', 'okey': 'Okey', 'double': 'Katlama' }[h.finish] || h.finish;
                    
                    hList.innerHTML += `
                        <div class="h-item">
                            <div><span style="font-weight:bold; color:#2c3e50;">${realIdx}. El</span> - ${winnerName}</div>
                            <div class="h-badge">${finishType} (-${h.points})</div>
                        </div>
                    `;
                });
            } else {
                hList.innerHTML = '<div style="text-align:center; color:#999; font-size:13px;">Henüz oyun verisi yok.</div>';
            }
        }

        function createCard(name, score, extraClass) {
            // Skor rengi: 0 ve altıysa kırmızı, değilse koyu
            const colorStyle = score <= 0 ? 'color:#e74c3c;' : '';
            
            return `
                <div class="s-card ${extraClass}">
                    <div class="s-name">${name}</div>
                    <div class="s-point" style="${colorStyle}">${score}</div>
                </div>
            `;
        }
    </script>

</body>
</html>
