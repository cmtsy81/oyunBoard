<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Okey Skor</title>
    <link rel="stylesheet" href="common.css">
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        /* ── DÜZ OKEY RENK TOKENları ──────────────── */
        :root { --accent: #667eea; --accent2: #764ba2; }
        .header      { background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); }
        .btn-start   { background: var(--accent); box-shadow: 0 4px 10px rgba(102,126,234,0.3); }
        .score-table th { background: var(--accent); }
        .h-item      { border-left-color: var(--accent); }
        .p-score     { font-size: 24px; font-weight: 800; color: var(--accent); }
        .player-card:active { background: #f0f2ff; border-color: var(--accent); }

        /* ── DÜZ OKEY'E ÖZGÜ ──────────────────────── */
        .team-a { border-left: 4px solid var(--accent); }
        .team-b { border-left: 4px solid #f093fb; }

        .center-info {
            text-align: center; color: #bdc3c7; font-size: 11px; font-weight: bold; line-height: 1.4;
            border: 2px dashed #eee; padding: 10px; border-radius: 50%;
            width: 100px; height: 100px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Setup butonları (mod & başlangıç sayısı) */
        .btn-group-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .setup-btn {
            flex: 1; padding: 12px; border: 1px solid #ddd; background: white;
            border-radius: 8px; font-weight: 600; color: #555; cursor: pointer;
            font-size: 14px; transition: all 0.2s;
        }
        .setup-btn.selected { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 2px 5px rgba(102,126,234,0.3); }

        /* Bitiş seçim butonları */
        .finish-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .f-btn { padding: 15px; border: 2px solid #eee; background: white; border-radius: 10px; font-weight: bold; color: #555; cursor: pointer; }
        .f-btn.normal  { border-color: var(--accent); color: var(--accent); }
        .f-btn.okey    { border-color: #d35400; color: #d35400; }
        .f-btn.katlama { border-color: #e74c3c; color: #e74c3c; }

        /* Oyun bitti banner */
        .game-over { background: #fff3cd; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; display: none; border: 1px solid #ffeeba; }
        .game-over.active { display: block; }
        .game-over h2 { color: #856404; margin-bottom: 10px; font-size: 20px; }

        /* Edit modal bazı özel stiller */
        .edit-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="btn-icon" onclick="goHome()">🏠</button>
            <h1>Okey</h1>
            <div class="header-right">
                <button class="btn-icon" id="btnShare" onclick="shareMasa()" title="Masayı Paylaş">📡</button>
                <button class="btn-icon" onclick="openSheetModal()" title="Puan Tablosu">📊</button>
                <button class="btn-icon" onclick="resetGameAttempt()" title="Sıfırla">🔄</button>
            </div>
        </div>

        <div class="content">
            <div class="setup-section active" id="setupSection">
                <label class="setup-label">Oyun Modu</label>
                <div class="btn-group-row">
                    <button class="setup-btn selected" onclick="setTeamMode(false, this)">Herkes Tek</button>
                    <button class="setup-btn" onclick="setTeamMode(true, this)">Eşli</button>
                </div>

                <label class="setup-label">Başlangıç Sayısı</label>
                <div class="btn-group-row">
                    <button class="setup-btn" onclick="setStartScore(10, this)">10</button>
                    <button class="setup-btn" onclick="setStartScore(12, this)">12</button>
                    <button class="setup-btn" onclick="setStartScore(16, this)">16</button>
                    <button class="setup-btn selected" onclick="setStartScore(20, this)">20</button>
                </div>

                <div class="table-layout">
                    <div class="pos-top setup-input-wrapper"><label class="setup-label">Karşı</label><input type="text" class="player-name-input" id="p2" value="Karşı"></div>
                    <div class="pos-left setup-input-wrapper"><label class="setup-label">Sol</label><input type="text" class="player-name-input" id="p3" value="Sol"></div>
                    <div class="pos-center" style="opacity:0.3; font-weight:bold; font-size:12px;">MASA</div>
                    <div class="pos-right setup-input-wrapper"><label class="setup-label">Sağ</label><input type="text" class="player-name-input" id="p1" value="Sağ"></div>
                    <div class="pos-bottom setup-input-wrapper"><label class="setup-label">Ben</label><input type="text" class="player-name-input" id="p0" value="Ben"></div>
                </div>
                <button class="btn-start" onclick="startGame()">Oyunu Başlat</button>
            </div>

            <div class="game-over" id="gameOver">
                <h2 id="gameOverMessage"></h2>
            </div>

            <div class="scoreboard" id="scoreboard">
                <div class="table-layout" id="gameTable">
                    <div class="pos-center">
                        <div class="center-info">BİTEN OYUNCUNUN<br>KARTINA TIKLA</div>
                    </div>
                </div>

                <div class="history-area">
                    <div class="history-label">Geçmiş Eller</div>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>
        <div class="footer-version" id="footerVersion">v1.4.0</div>
    </div>

    <!-- Bitiş Seçim Modal -->
    <div class="modal" id="finishModal">
        <div class="modal-sheet">
            <div style="text-align:center; margin-bottom:10px; font-weight:bold; font-size:16px;">
                <span id="modalPlayerName" style="color:var(--accent);"></span> Bitti
            </div>
            <div style="text-align:center; font-size:13px; color:#666; margin-bottom:15px;">Nasıl bittiğini seçin:</div>
            <div class="finish-options">
                <button class="f-btn normal"  onclick="submitRound('normal')">Normal<br>(2)</button>
                <button class="f-btn okey"    onclick="submitRound('okey')">Okey<br>(4)</button>
                <button class="f-btn katlama" onclick="submitRound('double')">Katlama<br>(8)</button>
            </div>
            <button onclick="closeModal('finishModal')" class="btn-modal-action btn-gray" style="width:100%; margin-top:15px;">Vazgeç</button>
        </div>
    </div>

    <!-- Düzenleme Modal -->
    <div class="modal" id="editModal">
        <div class="modal-sheet">
            <div style="text-align:center; margin-bottom:10px; font-weight:bold;">Eli Düzenle</div>
            <div style="margin-bottom:10px;">
                <label style="font-size:12px; font-weight:bold;">Biten Kişi:</label>
                <select id="editWinnerSelect" class="edit-select"></select>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:12px; font-weight:bold;">Bitiş Türü:</label>
                <div class="finish-options">
                    <button class="f-btn" id="editBtnTypeNormal" onclick="updateEditFinish('normal')">N (2)</button>
                    <button class="f-btn" id="editBtnTypeOkey"   onclick="updateEditFinish('okey')">O (4)</button>
                    <button class="f-btn" id="editBtnTypeDouble" onclick="updateEditFinish('double')">K (8)</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-action btn-gray" onclick="closeEditModal()">İptal</button>
                <button class="btn-modal-action btn-green" onclick="saveEditRound()">Güncelle</button>
            </div>
        </div>
    </div>

    <!-- Puan Tablosu Modal -->
    <div class="modal" id="sheetModal">
        <div class="modal-sheet">
            <div class="modal-title">Puan Tablosu</div>
            <div id="sheetContent" style="flex:1; overflow:auto;"></div>
            <div class="modal-actions">
                <button onclick="closeModal('sheetModal')" class="btn-modal-action btn-green">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div class="custom-dialog" id="customDialog">
        <div class="dialog-box">
            <h3 id="dTitle"></h3>
            <p id="dMsg"></p>
            <div id="dActions" class="d-actions"></div>
        </div>
    </div>

    <!-- Paylaşım Modalı -->
    <div class="modal" id="shareModal">
        <div class="modal-content" style="text-align:center;">
            <div class="modal-title">📡 Masayı Paylaş</div>
            <div style="margin:20px 0;">
                <div style="font-size:11px; color:#999; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;">Masa Kodu</div>
                <div id="shareMasaCode" style="font-size:52px; font-weight:900; letter-spacing:12px; color:var(--accent,#667eea);">----</div>
            </div>
            <div style="font-size:12px; color:#666; margin:10px 20px 20px; line-height:1.6;">
                Bu kodu izleyicilere gösterin.<br>
                <a id="shareLink" href="#" target="_blank" style="color:#3498db; word-break:break-all; font-size:11px;"></a>
            </div>
            <button class="btn-modal-action btn-green" id="btnCopyLink" onclick="copyShareLink()">🔗 Linki Kopyala</button>
            <div class="modal-actions" style="margin-top:10px;">
                <button class="btn-modal-action btn-gray" onclick="closeModal('shareModal')">Kapat</button>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script>
        const APP_VERSION = '1.4.0';
        setFooterVersion(APP_VERSION);

        const POSITIONS = ['pos-bottom', 'pos-right', 'pos-top', 'pos-left'];

        let gameState = {
            version: APP_VERSION, teamMode: false, startNumber: 20,
            scores: [], playerNames: [], gameActive: false, history: [],
            masaID: null
        };

        let tempWinnerIndex = null;
        let editState       = { index: null, finish: 'normal' };
        let setupState      = { teamMode: false, startNumber: 20 };

        function publishMasa() {
            if (!gameState.masaID || !gameState.gameActive) return;
            publishGameState(gameState.masaID, {
                gameType: 'okey',
                teamMode: gameState.teamMode,
                names   : gameState.playerNames,
                scores  : gameState.scores
            });
        }

        function shareMasa() {
            if (!gameState.gameActive) { alert('Önce oyun başlatın.'); return; }
            if (!gameState.masaID) { gameState.masaID = getSafeMasaID(); saveState(); }
            openShareModal(gameState.masaID);
            publishMasa();
        }

        window.onload = loadState;

        function setTeamMode(isTeam, btn) {
            setupState.teamMode = isTeam;
            btn.parentElement.querySelectorAll('.setup-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            toggleTeamInputs(isTeam);
        }

        function setStartScore(score, btn) {
            setupState.startNumber = score;
            btn.parentElement.querySelectorAll('.setup-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function toggleTeamInputs(isTeam) {
            const fields = [
                { id: 'p0', team: 'Biz',   solo: 'Ben',   isTeam },
                { id: 'p2', team: 'Biz',   solo: 'Karşı', isTeam },
                { id: 'p1', team: 'Rakip', solo: 'Sağ',   isTeam },
                { id: 'p3', team: 'Rakip', solo: 'Sol',   isTeam },
            ];
            fields.forEach(f => {
                const el = document.getElementById(f.id);
                el.value    = f.isTeam ? f.team : f.solo;
                el.disabled = f.isTeam;
            });
        }

        function startGame() {
            gameState.teamMode    = setupState.teamMode;
            gameState.startNumber = setupState.startNumber;
            if (gameState.teamMode) {
                gameState.playerNames = ['Biz', 'Rakip', 'Biz', 'Rakip'];
                gameState.scores = [gameState.startNumber, gameState.startNumber];
            } else {
                gameState.playerNames = ['p0','p1','p2','p3'].map(id => document.getElementById(id).value);
                gameState.scores = Array(4).fill(gameState.startNumber);
            }
            gameState.history = []; gameState.gameActive = true; gameState.version = APP_VERSION;
            updateUI(); saveState();
        }

        function onPlayerClick(index) {
            tempWinnerIndex = index;
            document.getElementById('modalPlayerName').textContent = gameState.playerNames[index];
            openModal('finishModal');
        }

        function submitRound(type) {
            closeModal('finishModal');
            const points = { 'normal': 2, 'okey': 4, 'double': 8 }[type];
            let winner   = tempWinnerIndex;

            if (gameState.teamMode) {
                winner = tempWinnerIndex % 2;
                gameState.scores[winner === 0 ? 1 : 0] -= points;
            } else {
                for (let i=0; i<4; i++) if (i !== winner) gameState.scores[i] -= points;
            }

            gameState.history.push({ winnerMask: tempWinnerIndex, finish: type, points });
            checkForEnd(); updateUI(); saveState(); publishMasa();
        }

        function checkForEnd() {
            if (gameState.scores.some(s => s <= 0)) {
                showDialog("Oyun Bitti!", "Skor sıfırlandı. Yeni oyun?", yes => {
                    if (yes) { localStorage.removeItem('okeyGameStatev14'); window.location.reload(); }
                }, "confirm");
            }
        }

        function openEditModal(historyIndex) {
            editState.index  = historyIndex;
            const round      = gameState.history[historyIndex];
            editState.finish = round.finish;
            const sel        = document.getElementById('editWinnerSelect');
            sel.innerHTML    = '';
            if (gameState.teamMode) {
                sel.add(new Option("Biz", 0)); sel.add(new Option("Rakip", 1));
                sel.value = round.winnerMask % 2;
            } else {
                gameState.playerNames.forEach((n, i) => sel.add(new Option(n, i)));
                sel.value = round.winnerMask;
            }
            updateEditFinish(round.finish);
            openModal('editModal');
        }

        function updateEditFinish(type) {
            editState.finish = type;
            const btnMap = { 'normal': 'editBtnTypeNormal', 'okey': 'editBtnTypeOkey', 'double': 'editBtnTypeDouble' };
            document.querySelectorAll('.finish-options .f-btn').forEach(b => { b.style.opacity = "0.5"; b.style.borderWidth = "2px"; });
            const el = document.getElementById(btnMap[type]);
            if (el) { el.style.opacity = "1"; el.style.borderWidth = "3px"; }
        }

        function saveEditRound() {
            const hIdx    = editState.index;
            const oldRound = gameState.history[hIdx];
            if (gameState.teamMode) {
                gameState.scores[(oldRound.winnerMask % 2 === 0) ? 1 : 0] += oldRound.points;
            } else {
                for (let i=0; i<4; i++) if (i !== oldRound.winnerMask) gameState.scores[i] += oldRound.points;
            }
            const newWinnerVal = parseInt(document.getElementById('editWinnerSelect').value);
            const newPoints    = { 'normal': 2, 'okey': 4, 'double': 8 }[editState.finish];
            if (gameState.teamMode) {
                gameState.scores[newWinnerVal === 0 ? 1 : 0] -= newPoints;
            } else {
                for (let i=0; i<4; i++) if (i !== newWinnerVal) gameState.scores[i] -= newPoints;
            }
            gameState.history[hIdx] = { winnerMask: newWinnerVal, finish: editState.finish, points: newPoints };
            closeEditModal(); updateUI(); saveState(); publishMasa();
        }

        function closeEditModal() { closeModal('editModal'); }

        function deleteRound(index) {
            if (index !== gameState.history.length - 1) { showDialog("Hata", "Sadece son el silinebilir", null, "alert"); return; }
            showDialog("Eli Sil", "Puanlar geri alınacak.", yes => {
                if (yes) {
                    const round = gameState.history[index];
                    if (gameState.teamMode) {
                        gameState.scores[(round.winnerMask % 2 === 0) ? 1 : 0] += round.points;
                    } else {
                        for (let i=0; i<4; i++) if (i !== round.winnerMask) gameState.scores[i] += round.points;
                    }
                    gameState.history.splice(index, 1);
                    updateUI(); saveState();
                }
            }, "danger");
        }

        function openSheetModal() {
            let html = `<table class="score-table"><thead><tr><th>EL</th>`;
            if (gameState.teamMode) html += `<th>Biz</th><th>Rakip</th>`;
            else gameState.playerNames.forEach(p => html += `<th>${p.substr(0,3)}</th>`);
            html += `</tr></thead><tbody>`;
            gameState.history.forEach((h, idx) => {
                html += `<tr><td>${idx+1}</td>`;
                let diffs = gameState.teamMode ? [0,0] : [0,0,0,0];
                if (gameState.teamMode) diffs[(h.winnerMask % 2 === 0) ? 1 : 0] = -h.points;
                else for (let i=0; i<4; i++) if (i !== h.winnerMask) diffs[i] = -h.points;
                diffs.forEach(d => { const color = d < 0 ? '#e74c3c' : '#2c3e50'; html += `<td style="color:${color}">${d === 0 ? '-' : d}</td>`; });
                html += `</tr>`;
            });
            html += `<tr class="total-row"><td>KALAN</td>`;
            gameState.scores.forEach(s => html += `<td>${s}</td>`);
            html += `</tr></tbody></table>`;
            document.getElementById('sheetContent').innerHTML = html;
            openModal('sheetModal');
        }

        function updateUI() {
            const setup = document.getElementById('setupSection');
            const board = document.getElementById('scoreboard');
            const hRight = document.querySelector('.header-right');
            if (!gameState.gameActive) {
                setup.classList.add('active'); board.classList.remove('active');
                document.getElementById('gameOver').classList.remove('active');
                hRight.style.display = 'none'; return;
            }
            setup.classList.remove('active'); board.classList.add('active');
            hRight.style.display = 'flex';

            const table  = document.getElementById('gameTable');
            const center = document.querySelector('.pos-center');
            table.innerHTML = ''; table.appendChild(center);

            for (let i=0; i<4; i++) {
                const name  = gameState.playerNames[i];
                const score = gameState.teamMode ? gameState.scores[i % 2] : gameState.scores[i];
                const teamC = gameState.teamMode ? (i % 2 === 0 ? 'team-a' : 'team-b') : '';
                const card  = document.createElement('div');
                card.className = `player-card ${POSITIONS[i]} ${teamC}`;
                card.onclick   = () => onPlayerClick(i);
                card.innerHTML = `<div class="p-name">${name}</div><div class="p-score">${score}</div>`;
                table.appendChild(card);
            }

            const hList = document.getElementById('historyList');
            hList.innerHTML = '';
            if (gameState.history.length === 0) hList.innerHTML = '<div style="color:#999; font-size:13px; text-align:center;">Henüz el kaydı yok</div>';
            [...gameState.history].reverse().forEach((h, idx) => {
                const realIdx   = gameState.history.length - 1 - idx;
                const finishName = { 'normal': 'Normal', 'okey': 'Okey', 'double': 'Katlama' }[h.finish];
                const wName     = gameState.playerNames[h.winnerMask];
                const delBtn    = realIdx === gameState.history.length-1 ? `<button class="btn-small btn-del" onclick="deleteRound(${realIdx})">SİL</button>` : '';
                hList.innerHTML += `
                    <div class="h-item">
                        <div class="h-left"><span style="color:var(--accent); font-weight:bold;">${realIdx+1}. El:</span> <strong>${wName}</strong> — ${finishName}</div>
                        <div class="h-actions"><button class="btn-small btn-edit" onclick="openEditModal(${realIdx})">DZN</button>${delBtn}</div>
                    </div>`;
            });
        }

        function saveState() { localStorage.setItem('okeyGameStatev14', JSON.stringify(gameState)); }
        function loadState() {
            const s = localStorage.getItem('okeyGameStatev14');
            if (s) { try { gameState = JSON.parse(s); updateUI(); } catch(e){} }
        }
        function resetGameAttempt() { showDialog("Sıfırla", "Oyun verileri silinecek.", y => { if(y){ localStorage.removeItem('okeyGameStatev14'); window.location.reload(); } }, "danger"); }
        function goHome() {
            if (gameState.gameActive) showDialog("Çıkış", "Menüye dön?", y => { if(y) window.location.href='index.html'; }, "normal");
            else window.location.href = 'index.html';
        }

        function showDialog(title, msg, callback, type) {
            document.getElementById('dTitle').textContent = title;
            document.getElementById('dMsg').textContent   = msg;
            const act = document.getElementById('dActions');
            act.innerHTML = '';
            const box = document.getElementById('customDialog');
            if (type === 'alert') {
                const b = document.createElement('button'); b.className = 'd-btn d-confirm'; b.textContent = "Tamam";
                b.onclick = () => box.classList.remove('active'); act.appendChild(b);
            } else {
                const b1 = document.createElement('button'); b1.className = 'd-btn d-cancel'; b1.textContent = "Vazgeç";
                b1.onclick = () => { box.classList.remove('active'); if(callback) callback(false); };
                const b2 = document.createElement('button'); b2.className = 'd-btn d-confirm'; b2.textContent = "Onayla";
                b2.onclick = () => { box.classList.remove('active'); if(callback) callback(true); };
                act.appendChild(b1); act.appendChild(b2);
            }
            box.classList.add('active');
        }
    </script>
</body>
</html>
