<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okey Skor Takibi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- YENİ HEADER TASARIMI --- */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-center {
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .header .status {
            font-size: 12px;
            opacity: 0.9;
        }

        .btn-icon {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.2);
        }
        /* --------------------------- */

        .content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .setup-section {
            display: none;
        }

        .setup-section.active {
            display: block;
        }

        .setup-group {
            margin-bottom: 16px;
        }

        .setup-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .setup-group input,
        .setup-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        .setup-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-start {
            flex: 1;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .scoreboard {
            display: none;
        }

        .scoreboard.active {
            display: block;
        }

        .scores-display {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 8px;
            border-radius: 8px;
            text-align: center;
        }

        .score-card.team2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .score-name {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .score-value {
            font-size: 32px;
            font-weight: bold;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        .controls-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            min-width: 80px;
        }

        .button-group {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .button-group.four {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
        }

        .button-group.three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .btn-toggle {
            padding: 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #333;
        }

        .btn-toggle.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .btn-toggle.finish-selected {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .confirm-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .confirm-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .history-section {
            margin-bottom: 20px;
        }

        .history-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item-text {
            color: #333;
        }

        .history-item-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-edit {
            background: #2196F3;
            color: white;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .game-over {
            background: #fff3cd;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }

        .game-over.active {
            display: block;
        }

        .game-over h2 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 16px;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
        }

        .modal-content {
            background: white;
            border-radius: 12px 12px 0 0;
            padding: 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }

        .modal-group {
            margin-bottom: 16px;
        }

        .modal-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .modal-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .modal-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .modal-btn.finish-selected {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-save {
            flex: 1;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-cancel {
            flex: 1;
            padding: 12px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="btn-icon" onclick="goHome()" title="Ana Sayfa">🏠</button>
            <div class="header-center">
                <h1>🃏 Okey</h1>
                <div class="status" id="status">Oyun Kurulumu</div>
            </div>
            <button class="btn-icon" onclick="resetGame()" title="Sıfırla">🔄</button>
        </div>

        <div class="content">
            <div class="setup-section active" id="setupSection">
                <div class="setup-group">
                    <label>Eşli mi oynamak istiyorsunuz?</label>
                    <select id="teamMode">
                        <option value="false">Hayır (4 oyuncu)</option>
                        <option value="true">Evet (2 takım)</option>
                    </select>
                </div>

                <div class="setup-group">
                    <label>Hangi sayıdan düşülsün?</label>
                    <input type="number" id="startNumber" value="20" min="1" max="100">
                </div>

                <div class="setup-buttons">
                    <button class="btn-start" onclick="startGame()">Oyunu Başlat</button>
                </div>
            </div>

            <div class="game-over" id="gameOver">
                <h2 id="gameOverMessage"></h2>
            </div>

            <div class="scoreboard" id="scoreboard">
                <div class="scores-display" id="scoresDisplay"></div>

                <div class="controls-row">
                    <div class="controls-label">Kim bitti?</div>
                    <div class="button-group four" id="winnerSelect"></div>
                </div>

                <div class="controls-row">
                    <div class="controls-label">Nasıl bitti?</div>
                    <div class="button-group three">
                        <button class="btn-toggle" onclick="selectFinish('normal', this)">Normal (2)</button>
                        <button class="btn-toggle" onclick="selectFinish('okey', this)">Okey (4)</button>
                        <button class="btn-toggle" onclick="selectFinish('double', this)">Katlamalı (8)</button>
                    </div>
                </div>

                <button class="confirm-btn" id="confirmBtn" onclick="submitRound()" disabled>El Kaydet</button>

                <div class="history-section" id="historySection">
                    <div class="history-title">El Geçmişi</div>
                    <div class="history-list" id="historyList"></div>
                </div>
            </div>
        </div>
        </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">El Düzenle</div>
            <div class="modal-group">
                <div class="modal-label">Kimin bitti?</div>
                <div class="modal-buttons" id="editWinnerSelect"></div>
            </div>
            <div class="modal-group">
                <div class="modal-label">Nasıl bitti?</div>
                <div class="modal-buttons" id="editFinishSelect"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-cancel" onclick="closeEditModal()">İptal</button>
                <button class="modal-save" onclick="saveEditRound()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = {
            teamMode: false,
            startNumber: 20,
            scores: [],
            playerNames: ['K', 'G', 'D', 'B'],
            selectedWinner: null,
            selectedFinish: null,
            gameActive: false,
            history: []
        };

        let editingRoundIndex = null;

        function startGame() {
            const teamMode = document.getElementById('teamMode').value === 'true';
            const startNumber = parseInt(document.getElementById('startNumber').value);

            if (startNumber < 1) {
                alert('Lütfen geçerli bir sayı girin');
                return;
            }

            gameState.teamMode = teamMode;
            gameState.startNumber = startNumber;
            gameState.scores = Array(teamMode ? 2 : 4).fill(startNumber);
            gameState.selectedWinner = null;
            gameState.selectedFinish = null;
            gameState.gameActive = true;
            gameState.history = [];

            document.getElementById('setupSection').classList.remove('active');
            document.getElementById('scoreboard').classList.add('active');
            document.getElementById('gameOver').classList.remove('active');

            renderScoreboard();
            updateStatus();
        }

        function renderScoreboard() {
            const display = document.getElementById('scoresDisplay');
            display.innerHTML = '';

            gameState.scores.forEach((score, index) => {
                const card = document.createElement('div');
                card.className = `score-card ${gameState.teamMode && index === 1 ? 'team2' : ''}`;
                card.innerHTML = `<div class="score-name">${gameState.playerNames[index]}</div><div class="score-value">${score}</div>`;
                display.appendChild(card);
            });

            renderWinnerSelect();
            renderHistory();
        }

        function renderWinnerSelect() {
            const select = document.getElementById('winnerSelect');
            select.innerHTML = '';

            gameState.scores.forEach((score, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-toggle';
                btn.textContent = gameState.playerNames[index];
                btn.onclick = () => selectWinner(index, btn);
                if (gameState.selectedWinner === index) {
                    btn.classList.add('selected');
                }
                select.appendChild(btn);
            });
        }

        function selectWinner(index, btn) {
            gameState.selectedWinner = index;
            document.querySelectorAll('#winnerSelect .btn-toggle').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            updateConfirmBtn();
        }

        function selectFinish(type, btn) {
            gameState.selectedFinish = type;
            btn.parentElement.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('finish-selected'));
            btn.classList.add('finish-selected');
            updateConfirmBtn();
        }

        function updateConfirmBtn() {
            const btn = document.getElementById('confirmBtn');
            btn.disabled = gameState.selectedWinner === null || gameState.selectedFinish === null;
        }

        function submitRound() {
            if (gameState.selectedWinner === null || gameState.selectedFinish === null) return;

            const pointMap = { 'normal': 2, 'okey': 4, 'double': 8 };
            const points = pointMap[gameState.selectedFinish];
            const winner = gameState.selectedWinner;

            gameState.history.push({
                winner: winner,
                finish: gameState.selectedFinish,
                points: points
            });

            for (let i = 0; i < gameState.scores.length; i++) {
                if (i !== winner) {
                    gameState.scores[i] -= points;
                }
            }

            gameState.selectedWinner = null;
            gameState.selectedFinish = null;
            document.querySelectorAll('#winnerSelect .btn-toggle').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('.button-group .btn-toggle').forEach(b => b.classList.remove('finish-selected'));

            const loserIndex = gameState.scores.findIndex(s => s <= 0);
            
            if (loserIndex !== -1) {
                gameState.gameActive = false;
                endGame(loserIndex);
            } else {
                renderScoreboard();
                updateConfirmBtn();
                updateStatus();
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            if (gameState.history.length === 0) {
                list.innerHTML = '<div style="color: #999; font-size: 13px;">Henüz el kaydı yok</div>';
                return;
            }

            gameState.history.forEach((round, idx) => {
                const finishText = { 'normal': 'Normal (2)', 'okey': 'Okey (4)', 'double': 'Katlamalı (8)' };
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-item-text"><strong>${gameState.playerNames[round.winner]}</strong> - ${finishText[round.finish]}</div>
                    <div class="history-item-buttons">
                        <button class="btn-small btn-edit" onclick="openEditModal(${idx})">Düzenle</button>
                        <button class="btn-small btn-delete" onclick="deleteRound(${idx})">Sil</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // YENİ: SİLME ONAYI EKLENDİ
        function deleteRound(idx) {
            if (!confirm('Bu eli silmek istediğinize emin misiniz? Puanlar geri alınacak.')) {
                return;
            }

            const round = gameState.history[idx];
            const pointMap = { 'normal': 2, 'okey': 4, 'double': 8 };

            for (let i = 0; i < gameState.scores.length; i++) {
                if (i !== round.winner) {
                    gameState.scores[i] += pointMap[round.finish];
                }
            }

            gameState.history.splice(idx, 1);
            renderScoreboard();
            updateStatus();
        }

        function openEditModal(idx) {
            editingRoundIndex = idx;
            const round = gameState.history[idx];

            const winnerSelect = document.getElementById('editWinnerSelect');
            winnerSelect.innerHTML = '';
            gameState.scores.forEach((score, index) => {
                const btn = document.createElement('button');
                btn.className = 'modal-btn';
                btn.textContent = gameState.playerNames[index];
                btn.dataset.winner = index;
                btn.onclick = () => {
                    document.querySelectorAll('#editWinnerSelect .modal-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                if (round.winner === index) {
                    btn.classList.add('selected');
                }
                winnerSelect.appendChild(btn);
            });

            const finishSelect = document.getElementById('editFinishSelect');
            finishSelect.innerHTML = '';
            ['normal', 'okey', 'double'].forEach(type => {
                const finishText = { 'normal': 'Normal (2)', 'okey': 'Okey (4)', 'double': 'Katlamalı (8)' };
                const btn = document.createElement('button');
                btn.className = 'modal-btn';
                btn.textContent = finishText[type];
                btn.dataset.finish = type;
                btn.onclick = () => {
                    document.querySelectorAll('#editFinishSelect .modal-btn').forEach(b => b.classList.remove('finish-selected'));
                    btn.classList.add('finish-selected');
                };
                if (round.finish === type) {
                    btn.classList.add('finish-selected');
                }
                finishSelect.appendChild(btn);
            });

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingRoundIndex = null;
        }

        function saveEditRound() {
            const winnerBtn = document.querySelector('#editWinnerSelect .modal-btn.selected');
            const finishBtn = document.querySelector('#editFinishSelect .modal-btn.finish-selected');

            if (!winnerBtn || !finishBtn) return;

            const newWinner = parseInt(winnerBtn.dataset.winner);
            const newFinish = finishBtn.dataset.finish;
            const oldRound = gameState.history[editingRoundIndex];
            const pointMap = { 'normal': 2, 'okey': 4, 'double': 8 };

            for (let i = 0; i < gameState.scores.length; i++) {
                if (i !== oldRound.winner) {
                    gameState.scores[i] += pointMap[oldRound.finish];
                }
            }

            const newPoints = pointMap[newFinish];
            for (let i = 0; i < gameState.scores.length; i++) {
                if (i !== newWinner) {
                    gameState.scores[i] -= newPoints;
                }
            }

            gameState.history[editingRoundIndex] = {
                winner: newWinner,
                finish: newFinish,
                points: newPoints
            };

            closeEditModal();
            renderScoreboard();
            updateStatus();
        }

        function endGame(loserIndex) {
            const winnerName = gameState.teamMode ? 
                (loserIndex === 0 ? 'Takım 2 (D-B)' : 'Takım 1 (K-G)') :
                gameState.playerNames[loserIndex];
            
            document.getElementById('gameOverMessage').textContent = `🎉 Oyun Bitti!\n${winnerName} kaybetti!`;
            document.getElementById('gameOver').classList.add('active');
            document.getElementById('scoreboard').classList.remove('active');
        }

        // YENİ: SADECE OYUNU BAŞA SARAR
        function resetGame() {
            // Eğer oyun aktif değilse (kurulum ekranındaysa) zaten gerek yok
            if (!gameState.gameActive) {
                 // Formu temizlemek isteyip istemediğini sorabiliriz, ama genelde kurulumda reset basılmaz.
                 // Yine de standart olsun:
                 if(confirm('Ayarları sıfırlamak istiyor musunuz?')) {
                     location.reload();
                 }
                 return;
            }

            if (confirm('Mevcut oyunu ve skorları sıfırlamak istiyor musunuz? (Ayarlar korunur)')) {
                // Ayarları koru, oyunu yeniden başlat
                gameState.scores = Array(gameState.teamMode ? 2 : 4).fill(gameState.startNumber);
                gameState.selectedWinner = null;
                gameState.selectedFinish = null;
                gameState.history = [];
                
                document.getElementById('gameOver').classList.remove('active');
                document.getElementById('scoreboard').classList.add('active');
                
                renderScoreboard();
                updateStatus();
            }
        }

        // YENİ: ANA EKRANA DÖNER
        function goHome() {
            if (gameState.gameActive) {
                if (confirm('Ana menüye dönmek istiyor musunuz? Mevcut oyun sonlandırılacak.')) {
                    gameState.gameActive = false;
                    gameState.selectedWinner = null;
                    gameState.selectedFinish = null;
                    gameState.history = [];
                    
                    document.getElementById('setupSection').classList.add('active');
                    document.getElementById('scoreboard').classList.remove('active');
                    document.getElementById('gameOver').classList.remove('active');
                    document.getElementById('status').textContent = 'Oyun kurulumunu başlatın';
                }
            } else {
                // Zaten ana ekrandaysa bir şey yapmaya gerek yok veya sayfayı yenileyebiliriz
            }
        }

        function updateStatus() {
            if (gameState.gameActive) {
                document.getElementById('status').textContent = `${gameState.startNumber} sayıdan - ${gameState.history.length} el`;
            } else {
                document.getElementById('status').textContent = 'Oyun kurulumunu başlatın';
            }
        }
    </script>
</body>
</html>
