<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zar At</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #2d3436; 
            overscroll-behavior-y: contain; 
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.5s ease, color 0.5s ease; 
        }

        /* RENK TEMALARI */
        body.turn-pink { background-color: #ffcce0; color: #333 !important; }
        body.turn-blue { background-color: #cce0ff; color: #333 !important; }
        body.turn-pink .header, body.turn-blue .header { color: white; }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
            flex-shrink: 0; /* Header sıkışmasın */
        }
        .header h1 { font-size: 20px; }
        .btn-icon {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        /* MAIN AREA (ZAR ALANI) - GÜNCELLENDİ */
        .scene {
            /* flex: 1;  <-- ESKİSİ: Tüm boşluğu kaplıyordu */
            height: 50vh; /* YENİSİ: Ekranın yarısı kadar olsun */
            min-height: 300px; /* Çok küçük ekranlarda zarlar ezilmesin */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
            position: relative;
        }

        /* ZAR ALANI */
        .dice-container {
            display: flex;
            gap: 50px;
            margin-bottom: 0; /* Alt boşluğu sıfırladık */
            transition: gap 0.3s;
        }
        .dice-container.single { gap: 0; }

        /* KÜP YAPISI */
        .cube {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #ddd;
            backface-visibility: hidden; 
        }

        .dot {
            width: 18px;
            height: 18px;
            background: #333;
            border-radius: 50%;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.5);
        }

        .front  { transform: translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }

        .face { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 12px; }
        .dot { place-self: center; }
        
        .face-1 .dot:nth-child(1) { grid-area: 2 / 2; }
        .face-2 .dot:nth-child(1) { grid-area: 1 / 1; } .face-2 .dot:nth-child(2) { grid-area: 3 / 3; }
        .face-3 .dot:nth-child(1) { grid-area: 1 / 1; } .face-3 .dot:nth-child(2) { grid-area: 2 / 2; } .face-3 .dot:nth-child(3) { grid-area: 3 / 3; }
        .face-4 .dot:nth-child(1) { grid-area: 1 / 1; } .face-4 .dot:nth-child(2) { grid-area: 1 / 3; } .face-4 .dot:nth-child(3) { grid-area: 3 / 1; } .face-4 .dot:nth-child(4) { grid-area: 3 / 3; }
        .face-5 .dot:nth-child(1) { grid-area: 1 / 1; } .face-5 .dot:nth-child(2) { grid-area: 1 / 3; } .face-5 .dot:nth-child(3) { grid-area: 2 / 2; } .face-5 .dot:nth-child(4) { grid-area: 3 / 1; } .face-5 .dot:nth-child(5) { grid-area: 3 / 3; }
        .face-6 .dot:nth-child(1) { grid-area: 1 / 1; } .face-6 .dot:nth-child(2) { grid-area: 1 / 3; } .face-6 .dot:nth-child(3) { grid-area: 2 / 1; } .face-6 .dot:nth-child(4) { grid-area: 2 / 3; } .face-6 .dot:nth-child(5) { grid-area: 3 / 1; } .face-6 .dot:nth-child(6) { grid-area: 3 / 3; }

        /* KONTROLLER - GÜNCELLENDİ */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            text-align: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            flex: 1; /* Kalan boşluğu doldursun */
        }

        .total-display {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            height: 40px;
        }

        .btn-roll {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,184,148, 0.4);
            transition: all 0.2s;
            margin-bottom: 15px;
        }
        .btn-roll:active { transform: scale(0.98); }
        .btn-roll:disabled { background: #b2bec3; cursor: not-allowed; box-shadow: none; transform: none; }

        .mode-switch {
            display: flex;
            background: #f0f0f0;
            border-radius: 10px;
            padding: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            background: transparent;
        }
        .mode-btn.active { background: white; color: #00b894; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .shadow {
            width: 100px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            filter: blur(10px);
            margin-top: 60px;
            position: absolute;
            bottom: -40px;
            transition: all 0.3s;
        }
        .rolling .shadow { transform: scale(0.5); opacity: 0.5; }

        .footer-version {
            text-align: center;
            padding: 5px;
            font-size: 9px;
            color: #888;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }
        body.turn-pink .footer-version, body.turn-blue .footer-version {
            background: rgba(255,255,255,0.5);
            color: #555;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-icon" onclick="location.href='index.html'">🏠</button>
        <h1>Zar At</h1>
        <div style="width: 30px;"></div>
    </div>

    <div class="scene">
        <div class="dice-container" id="diceContainer">
            <div style="position: relative;">
                <div class="cube" id="die1">
                    <div class="face front face-1"><div class="dot"></div></div>
                    <div class="face back face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face right face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face left face-2"><div class="dot"></div><div class="dot"></div></div>
                    <div class="face top face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face bottom face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>
                <div class="shadow"></div>
            </div>
            <div style="position: relative; display: none;" id="die2Wrapper">
                <div class="cube" id="die2">
                    <div class="face front face-1"><div class="dot"></div></div>
                    <div class="face back face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face right face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face left face-2"><div class="dot"></div><div class="dot"></div></div>
                    <div class="face top face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face bottom face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>
                <div class="shadow"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="total-display" id="totalDisplay">Hazır</div>
        
        <button class="btn-roll" id="btnRoll" onclick="rollDice()">ZAR AT</button>
        
        <div class="mode-switch">
            <button class="mode-btn active" onclick="setMode(2)" id="btn2">Çift Zar</button>
            <button class="mode-btn" onclick="setMode(1)" id="btn1">Tek Zar</button>
        </div>
    </div>

    <div class="footer-version" id="footerVersion">v1.0.3</div>

    <script>
        const APP_VERSION = '1.0.3';
        document.getElementById('footerVersion').textContent = 'v' + APP_VERSION;

        let mode = 2; 
        let isRolling = false;
        let turnCounter = 0; 
        const COOLDOWN_SECONDS = 5; 

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playClickSound() {
            if (audioContext.state === 'suspended') audioContext.resume();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        function setMode(n) {
            if (isRolling) return;
            mode = n;
            document.getElementById('btn1').className = n === 1 ? 'mode-btn active' : 'mode-btn';
            document.getElementById('btn2').className = n === 2 ? 'mode-btn active' : 'mode-btn';
            
            const container = document.getElementById('diceContainer');
            const die2 = document.getElementById('die2Wrapper');
            
            if (n === 1) {
                die2.style.display = 'none';
                container.classList.add('single');
            } else {
                die2.style.display = 'block';
                container.classList.remove('single');
            }
            document.getElementById('totalDisplay').textContent = 'Hazır';
        }

        function updateBackground() {
            turnCounter++;
            if (turnCounter % 2 !== 0) {
                document.body.className = 'turn-pink';
            } else {
                document.body.className = 'turn-blue';
            }
        }

        function startCooldown() {
            const btn = document.getElementById('btnRoll');
            btn.disabled = true;
            let timeLeft = COOLDOWN_SECONDS;
            
            btn.textContent = `Bekle... (${timeLeft})`;
            
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    btn.textContent = `Bekle... (${timeLeft})`;
                } else {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = "ZAR AT";
                }
            }, 1000);
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            
            updateBackground();
            startCooldown();

            document.getElementById('totalDisplay').textContent = '...';
            document.body.classList.add('rolling');

            const result1 = Math.floor(Math.random() * 6) + 1;
            const result2 = Math.floor(Math.random() * 6) + 1;

            rotateDie('die1', result1);
            if (mode === 2) rotateDie('die2', result2);

            playClickSound();
            setTimeout(playClickSound, 200);
            setTimeout(playClickSound, 500);

            setTimeout(() => {
                isRolling = false;
                document.body.classList.remove('rolling');
                if (navigator.vibrate) navigator.vibrate(100);

                if (mode === 1) {
                    document.getElementById('totalDisplay').textContent = `Sonuç: ${result1}`;
                } else {
                    document.getElementById('totalDisplay').textContent = `Toplam: ${result1 + result2} (${result1} + ${result2})`;
                }
            }, 1000);
        }

        function rotateDie(elementId, number) {
            const die = document.getElementById(elementId);
            const xRand = Math.floor(Math.random() * 3) * 360 + 720;
            const yRand = Math.floor(Math.random() * 3) * 360 + 720;
            let x = 0, y = 0;

            switch(number) {
                case 1: x = 0; y = 0; break;
                case 6: x = 180; y = 0; break;
                case 2: x = 0; y = 90; break;
                case 5: x = 0; y = -90; break;
                case 3: x = -90; y = 0; break;
                case 4: x = 90; y = 0; break;
            }
            die.style.transform = `rotateX(${x + xRand}deg) rotateY(${y + yRand}deg)`;
        }

        setMode(2);
    </script>
</body>
</html>
