<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zar At</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* zarAt kendi özel layout'una sahip — container kullanmaz */
        body {
            background: #2d3436;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.5s ease;
            overscroll-behavior-y: contain;
        }
        body.turn-pink { background-color: #ffcce0; color: #333; }
        body.turn-blue { background-color: #cce0ff; color: #333; }

        /* Header — common.css header'ını override et (dark body yüzünden) */
        .header {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%) !important;
            color: white !important;
            flex-shrink: 0;
            z-index: 10;
        }
        .btn-icon { color: white !important; font-size: 24px; }
        body.turn-pink .header, body.turn-blue .header { color: white !important; }

        /* ── ZAR SAHNESİ ──────────────────────────── */
        .scene {
            flex: 1;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
            position: relative;
        }

        .dice-container { display: flex; gap: 50px; transition: gap 0.3s; }
        .dice-container.single { gap: 0; }

        .cube {
            width: 100px; height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .face {
            position: absolute; width: 100%; height: 100%;
            background: white; border-radius: 16px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
            border: 1px solid #ddd; backface-visibility: hidden;
            display: grid; grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr); padding: 12px;
        }

        /* Yüz transformları */
        .front  { transform: translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }

        /* Nokta stili — common.css'deki .dot'u override et (zar için özel) */
        .face .dot {
            place-self: center;
            width: 18px; height: 18px;
            background: #333; border-radius: 50%;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.5);
            border: none; /* common.css'deki dot border'ını iptal et */
        }

        /* Yüz nokta yerleşimleri */
        .face-1 .dot:nth-child(1) { grid-area: 2 / 2; }
        .face-2 .dot:nth-child(1) { grid-area: 1 / 1; } .face-2 .dot:nth-child(2) { grid-area: 3 / 3; }
        .face-3 .dot:nth-child(1) { grid-area: 1 / 1; } .face-3 .dot:nth-child(2) { grid-area: 2 / 2; } .face-3 .dot:nth-child(3) { grid-area: 3 / 3; }
        .face-4 .dot:nth-child(1) { grid-area: 1 / 1; } .face-4 .dot:nth-child(2) { grid-area: 1 / 3; } .face-4 .dot:nth-child(3) { grid-area: 3 / 1; } .face-4 .dot:nth-child(4) { grid-area: 3 / 3; }
        .face-5 .dot:nth-child(1) { grid-area: 1 / 1; } .face-5 .dot:nth-child(2) { grid-area: 1 / 3; } .face-5 .dot:nth-child(3) { grid-area: 2 / 2; } .face-5 .dot:nth-child(4) { grid-area: 3 / 1; } .face-5 .dot:nth-child(5) { grid-area: 3 / 3; }
        .face-6 .dot:nth-child(1) { grid-area: 1 / 1; } .face-6 .dot:nth-child(2) { grid-area: 1 / 3; } .face-6 .dot:nth-child(3) { grid-area: 2 / 1; } .face-6 .dot:nth-child(4) { grid-area: 2 / 3; } .face-6 .dot:nth-child(5) { grid-area: 3 / 1; } .face-6 .dot:nth-child(6) { grid-area: 3 / 3; }

        .shadow {
            width: 100px; height: 20px;
            background: rgba(0,0,0,0.3); border-radius: 50%;
            filter: blur(10px); margin-top: 60px;
            position: absolute; bottom: -40px;
            transition: all 0.3s;
        }
        .rolling .shadow { transform: scale(0.5); opacity: 0.5; }

        /* ── KONTROLLER ───────────────────────────── */
        .controls {
            background: white; padding: 20px;
            border-radius: 20px 20px 0 0;
            text-align: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        body.turn-pink .controls, body.turn-blue .controls { background: rgba(255,255,255,0.85); }

        .total-display { font-size: 32px; font-weight: bold; color: #333; margin-bottom: 20px; height: 40px; }

        .btn-roll {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            border: none; border-radius: 12px; color: white;
            font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,184,148,0.4);
            transition: all 0.2s; margin-bottom: 15px;
        }
        .btn-roll:active  { transform: scale(0.98); }
        .btn-roll:disabled { background: #b2bec3; cursor: not-allowed; box-shadow: none; transform: none; }

        .mode-switch { display: flex; background: #f0f0f0; border-radius: 10px; padding: 4px; }
        .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: #666; background: transparent; }
        .mode-btn.active { background: white; color: #00b894; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .footer-version {
            text-align: center; padding: 5px; font-size: 9px; color: #888;
            background: #f9f9f9; border-top: 1px solid #eee;
        }
        body.turn-pink .footer-version, body.turn-blue .footer-version { background: rgba(255,255,255,0.5); color: #555; }
    </style>
</head>
<body>
    <div class="header">
        <button class="btn-icon" onclick="window.location.href='index.html'">🏠</button>
        <h1>Zar At</h1>
        <div style="width:34px;"></div>
    </div>

    <div class="scene">
        <div class="dice-container" id="diceContainer">
            <div style="position:relative;">
                <div class="cube" id="die1">
                    <div class="face front face-1"><div class="dot"></div></div>
                    <div class="face back face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face right face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face left face-2"><div class="dot"></div><div class="dot"></div></div>
                    <div class="face top face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face bottom face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>
                <div class="shadow"></div>
            </div>
            <div style="position:relative; display:none;" id="die2Wrapper">
                <div class="cube" id="die2">
                    <div class="face front face-1"><div class="dot"></div></div>
                    <div class="face back face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face right face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face left face-2"><div class="dot"></div><div class="dot"></div></div>
                    <div class="face top face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="face bottom face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>
                <div class="shadow"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="total-display" id="totalDisplay">Hazır</div>
        <button class="btn-roll" id="btnRoll" onclick="rollDice()">ZAR AT</button>
        <div class="mode-switch">
            <button class="mode-btn active" onclick="setMode(2)" id="btn2">Çift Zar</button>
            <button class="mode-btn"        onclick="setMode(1)" id="btn1">Tek Zar</button>
        </div>
    </div>
    <div class="footer-version" id="footerVersion">v1.0.0</div>

    <script>
        // zarAt.html kendi bağımsız JS'ini kullanır (audioCtx çakışmasını önlemek için common.js yüklenmez)
        const APP_VERSION = '1.0.0';
        document.getElementById('footerVersion').textContent = 'v' + APP_VERSION;

        let mode = 2, isRolling = false, turnCounter = 0;
        const COOLDOWN_SECONDS = 5;

        // Ses
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRollSound() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200 + Math.random() * 100, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                }, i * 120);
            }
        }

        function setMode(m) {
            mode = m;
            document.getElementById('die2Wrapper').style.display = m === 2 ? 'block' : 'none';
            document.getElementById('diceContainer').className = 'dice-container' + (m === 1 ? ' single' : '');
            document.getElementById('btn1').className = 'mode-btn' + (m === 1 ? ' active' : '');
            document.getElementById('btn2').className = 'mode-btn' + (m === 2 ? ' active' : '');
            document.getElementById('totalDisplay').textContent = 'Hazır';
            document.body.className = '';
        }

        const TRANSFORMS = {
            1: 'rotateX(0deg) rotateY(0deg)',
            2: 'rotateX(0deg) rotateY(-90deg)',
            3: 'rotateX(-90deg) rotateY(0deg)',
            4: 'rotateX(90deg) rotateY(0deg)',
            5: 'rotateX(0deg) rotateY(90deg)',
            6: 'rotateY(180deg)',
        };

        function rollDice() {
            if (isRolling) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isRolling = true;
            document.getElementById('btnRoll').disabled = true;
            document.getElementById('totalDisplay').textContent = '...';

            const val1 = Math.ceil(Math.random() * 6);
            const val2 = mode === 2 ? Math.ceil(Math.random() * 6) : null;

            const spin = `rotateX(${720 + Math.random()*360}deg) rotateY(${720 + Math.random()*360}deg)`;
            document.getElementById('die1').style.transform = spin;
            if (mode === 2) document.getElementById('die2').style.transform = spin;

            document.getElementById('diceContainer').classList.add('rolling');
            playRollSound();

            setTimeout(() => {
                document.getElementById('die1').style.transform = TRANSFORMS[val1];
                if (mode === 2) document.getElementById('die2').style.transform = TRANSFORMS[val2];
                document.getElementById('diceContainer').classList.remove('rolling');

                const total = mode === 2 ? val1 + val2 : val1;
                document.getElementById('totalDisplay').textContent = mode === 2 ? `${val1} + ${val2} = ${total}` : `${val1}`;

                turnCounter++;
                const turn = turnCounter;
                if (turn % 2 === 1) { document.body.className = 'turn-pink'; }
                else                { document.body.className = 'turn-blue'; }

                isRolling = false;
                setTimeout(() => {
                    document.getElementById('btnRoll').disabled = false;
                }, COOLDOWN_SECONDS * 1000);

            }, 1000);
        }
    </script>
</body>
</html>
